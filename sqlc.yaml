version: "2"
sql:
  - schema: "db/migrations"   # pasta ou arquivo .sql com criação de tabelas
    queries: "db/queries"     # pasta ou arquivo .sql com queries
    engine: "postgresql"
    gen:
      go:
        package: "db"         # nome do pacote Go gerado
        out: "db/sqlc"        # pasta de saída dos arquivos Go
